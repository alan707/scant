[workspace]
resolver = "2"
members = ["crates/scant-core", "crates/scant-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/alan707/scant"

[workspace.dependencies]
# Not published as a stable crates.io API -- pin to the latest tagged ruff release.
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.2" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.2" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.16.2" }
ignore = "0.4.33"
rayon = "1.12.0"
clap = { version = "4.6.6", features = ["derive"] }
toml = "1.1"
pep508_rs = "0.9.2"
configparser = "3.2.0"
serde = { version = "1", features = ["derive"] }
insta = "1"
owo-colors = "4.3.0"
anstream = "1.0.0"
