name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  smoke-test:
    name: Smoke test (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: git clone --depth 1 https://github.com/mkdocs/mkdocs.git /tmp/mkdocs
      - name: Run scant against mkdocs
        run: |
          output=$(cargo run --quiet -- /tmp/mkdocs)
          echo "$output"
          echo "$output" | grep -qE "scanned [1-9][0-9]* files" || (echo "::error::scant reported zero files scanned against a real repo (mkdocs)" && exit 1)
